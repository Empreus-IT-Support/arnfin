<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon. The logo's own device, reduced to what survives at 16px: the
    square, and the one idea that gets out of it. Brand gold #FFDD00 with the
    wordmark ink #1A1717, both sampled from the real logo.
    Vector so it stays sharp at every size the browser asks for.
  -->
  <rect width="32" height="32" rx="7" fill="#FFDD00"/>
  <rect x="6.6" y="11.4" width="14" height="14" rx="2.2"
        fill="none" stroke="#1A1717" stroke-width="2.6"/>
  <circle cx="24.4" cy="8.1" r="3.4" fill="#1A1717"/>
</svg>
